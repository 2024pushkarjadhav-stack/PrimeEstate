services:
  # ===========================================================================
  # Backend Web Service: Node.js / Express REST API & Socket.IO
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: primeestate-backend:latest
    container_name: primeestate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:3000,http://localhost:5173,http://localhost
      - CLIENT_URL=http://localhost:3000,http://localhost:5173,http://localhost
    networks:
      - primeestate-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ===========================================================================
  # Frontend Web Service: React 18 / Vite SPA served with Nginx
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_SOCKET_URL=/
    image: primeestate-frontend:latest
    container_name: primeestate-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - primeestate-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# =============================================================================
# Custom Bridge Network for Isolated Inter-Container Communication
# =============================================================================
networks:
  primeestate-network:
    name: primeestate-network
    driver: bridge
