name: PrimeEstate Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # Job 1: Backend Automated Testing & Verification
  # -----------------------------------------------------------
  backend-test:
    name: Backend CI (Node.js & Security Tests)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run Backend CI Unit & Security Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          JWT_SECRET: github_actions_ci_jwt_test_secret_32_chars
          CLIENT_URL: https://primeestate.vercel.app
        run: npm test

  # -----------------------------------------------------------
  # Job 2: Frontend Production Build Verification
  # -----------------------------------------------------------
  frontend-build:
    name: Frontend CI (React / Vite Build)
    runs-on: ubuntu-latest
    needs: [ backend-test ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://primeestate-backend.onrender.com/api
          VITE_SOCKET_URL: https://primeestate-backend.onrender.com
        run: npm run build
